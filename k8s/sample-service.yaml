apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
spec:
  replicas: 3
  selector:
    matchLabels: { app: sample-service }
  template:
    metadata:
      labels: { app: sample-service }
    spec:
      containers:
        - name: sample-service
          image: hashicorp/http-echo
          args: ["-text=ok"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: sample-service
spec:
  selector: { app: sample-service }
  ports: [{ port: 80, targetPort: 5678 }]
